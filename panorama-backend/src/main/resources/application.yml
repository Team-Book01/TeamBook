spring:
  application:
    name: panorama
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # 레코드(record) DTO 생성자 매핑을 '컬럼 순서'가 아닌 '인자 이름' 기준으로 한다.
    # → SELECT 컬럼 순서/개수가 생성자와 달라도 이름으로 안전하게 매핑(레코드 필수).
    arg-name-based-constructor-auto-mapping: true
  type-aliases-package: com.teambook.panorama.domain
  mapper-locations: classpath:mapper/**/*.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html          # 접속 주소: http://localhost:8080/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.teambook.panorama: INFO
naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
library-bigdata:
  auth-key: ${LIBRARY_BIGDATA_AUTH_KEY}
app:
  https: false
  upload:
    dir: ./uploads
    
data4library:
  base-url: http://data4library.kr
  auth-key: ${DATA4LIBRARY_AUTH_KEY}

vision:
  api:
    key: ${VISION_API_KEY}

